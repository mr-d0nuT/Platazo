<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platàs - Buscador Gastronómico Hiperlocal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
        }
        .pulse-ring {
            animation: pulse-ring 2s infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(249, 115, 22, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); }
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2.5 cursor-pointer" onclick="resetSearch()">
                <div class="w-10 h-10 rounded-xl bg-orange-500 flex items-center justify-center text-white shadow-md shadow-orange-500/20">
                    <i class="fa-solid fa-utensils text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-tight text-slate-900">Platàs</h1>
                    <p class="text-xs text-slate-500">Radar de platos y menús en vivo</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <!-- Selector de Ubicación -->
                <div class="flex items-center bg-slate-100 hover:bg-slate-200/80 transition rounded-xl px-3 py-1.5 border border-slate-200 text-xs font-medium">
                    <button onclick="detectUserLocation()" title="Usar mi GPS" class="text-orange-500 hover:text-orange-600 mr-2 transition cursor-pointer">
                        <i class="fa-solid fa-location-crosshairs text-sm"></i>
                    </button>
                    <input type="text" id="locationInput" value="Barcelona Centro" class="bg-transparent border-none outline-none text-slate-700 w-28 md:w-45 font-medium" placeholder="Barrio o ciudad...">
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full">
        
        <!-- BARRA DE BÚSQUEDA Y VOZ -->
        <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 mb-6">
            <div class="flex items-center gap-2">
                <div class="flex-1 flex items-center bg-slate-50 rounded-xl px-3.5 py-2 border border-slate-200 focus-within:border-orange-500 focus-within:bg-white transition">
                    <i class="fa-solid fa-magnifying-glass text-slate-400 mr-3"></i>
                    <input type="text" id="searchInput" placeholder="¿Qué os apetece hoy? (ej. Ramen, Pizza, Menú del día, Callos...)" class="w-full bg-transparent border-none outline-none text-sm text-slate-800 placeholder-slate-400" onkeydown="if(event.key==='Enter') performSearch()">
                    <button id="micBtn" onclick="toggleVoiceSearch()" class="text-slate-400 hover:text-orange-500 p-1.5 transition rounded-lg hover:bg-orange-50 ml-2 cursor-pointer" title="Búsqueda por voz">
                        <i class="fa-solid fa-microphone text-sm"></i>
                    </button>
                </div>
                <button onclick="performSearch()" class="bg-orange-500 hover:bg-orange-600 text-white font-semibold px-5 py-3 rounded-xl text-sm transition shadow-sm shadow-orange-500/25 flex items-center gap-2 cursor-pointer">
                    <span>Buscar</span>
                </button>
            </div>

            <!-- ETIQUETAS RÁPIDAS -->
            <div class="flex items-center gap-2 mt-3 overflow-x-auto pb-1 text-xs no-scrollbar">
                <span class="text-slate-400 font-medium whitespace-nowrap"><i class="fa-solid fa-fire mr-1 text-orange-500"></i> Sugerencias:</span>
                <button onclick="quickSearch('Menú del día')" class="bg-orange-50 text-orange-700 hover:bg-orange-100 font-semibold px-3 py-1.5 rounded-lg border border-orange-200/60 whitespace-nowrap transition cursor-pointer">
                    🍽️ Menú del día
                </button>
                <button onclick="quickSearch('Ramen')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-1.5 rounded-lg whitespace-nowrap transition cursor-pointer">
                    🍜 Ramen
                </button>
                <button onclick="quickSearch('Pizza')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-1.5 rounded-lg whitespace-nowrap transition cursor-pointer">
                    🍕 Pizza
                </button>
                <button onclick="quickSearch('Callos')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-1.5 rounded-lg whitespace-nowrap transition cursor-pointer">
                    🔥 Callos
                </button>
                <button onclick="quickSearch('Hamburguesa')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-1.5 rounded-lg whitespace-nowrap transition cursor-pointer">
                    🍔 Hamburguesa
                </button>
            </div>
        </div>

        <div class="flex justify-between items-center mb-4 px-1">
            <h2 id="resultsTitle" class="font-bold text-slate-800 text-base">Recomendaciones hiperlocales</h2>
            
            <div class="flex items-center gap-2">
                <span class="text-xs text-slate-500 font-medium">Ordenar por:</span>
                <select id="sortSelect" onchange="sortResults()" class="bg-white border border-slate-200 text-slate-700 text-xs rounded-lg px-2.5 py-1.5 outline-none font-medium shadow-xs cursor-pointer">
                    <option value="rating">Mejor puntuados</option>
                    <option value="distance">Más cercanos</option>
                </select>
            </div>
        </div>

        <!-- CONTENEDOR DE TARJETAS -->
        <div id="resultsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Estado Inicial de bienvenida -->
            <div class="col-span-full py-16 text-center bg-white rounded-2xl border border-slate-200 shadow-xs">
                <div class="w-16 h-16 bg-orange-100 text-orange-500 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
                    <i class="fa-solid fa-compass"></i>
                </div>
                <h3 class="font-bold text-slate-800 text-lg mb-1">¿Qué plato buscamos hoy?</h3>
                <p class="text-sm text-slate-500 max-w-sm mx-auto mb-6">Escribe cualquier plato (Ramen, Pizza, Menú...) o usa las etiquetas rápidas.</p>
                <button onclick="quickSearch('Menú del día')" class="bg-slate-900 hover:bg-slate-800 text-white font-medium px-5 py-2.5 rounded-xl text-sm transition cursor-pointer">
                    Buscar Menús del Día
                </button>
            </div>
        </div>

    </main>

    <div class="fixed bottom-6 right-6 z-50">
        <button id="liveAssistantBtn" onclick="toggleLiveAssistant()" class="bg-slate-900 hover:bg-slate-800 text-white p-4 rounded-full shadow-xl flex items-center gap-3 transition transform hover:scale-105 border-2 border-orange-500/50 cursor-pointer" title="Asistente de voz">
            <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
            <i class="fa-solid fa-headphones text-lg text-orange-400"></i>
            <span class="text-xs font-bold pr-1 hidden md:inline">Asistente Platàs</span>
        </button>
    </div>

    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400 mt-auto">
        <p>Platàs - Buscador hiperlocal inteligente 🍽️</p>
    </footer>

    <script>
        let currentResults = [];
        let isListening = false;
        let recognition = null;

        window.addEventListener('DOMContentLoaded', () => {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'es-ES';
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onresult = (event) => {
                    const text = event.results[0][0].transcript;
                    document.getElementById('searchInput').value = text;
                    stopVoiceIndicator();
                    performSearch();
                };

                recognition.onerror = () => { stopVoiceIndicator(); };
                recognition.onend = () => { stopVoiceIndicator(); };
            }
        });

        function showCustomMessage(msg) {
            const div = document.createElement('div');
            div.className = 'fixed top-5 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-xl shadow-xl z-50 animate-in fade-in slide-in-from-top-4 duration-200';
            div.innerText = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        function quickSearch(query) {
            document.getElementById('searchInput').value = query;
            performSearch();
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('resultsContainer').innerHTML = `
                <div class="col-span-full py-16 text-center bg-white rounded-2xl border border-slate-200 shadow-xs">
                    <div class="w-16 h-16 bg-orange-100 text-orange-500 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
                        <i class="fa-solid fa-compass"></i>
                    </div>
                    <h3 class="font-bold text-slate-800 text-lg mb-1">¿Qué plato buscamos hoy?</h3>
                    <p class="text-sm text-slate-500 max-w-sm mx-auto mb-6">Escribe cualquier plato (Ramen, Pizza, Menú...) o usa las etiquetas rápidas.</p>
                    <button onclick="quickSearch('Menú del día')" class="bg-slate-900 hover:bg-slate-800 text-white font-medium px-5 py-2.5 rounded-xl text-sm transition cursor-pointer">
                        Buscar Menús del Día
                    </button>
                </div>
            `;
            document.getElementById('resultsTitle').innerText = 'Recomendaciones hiperlocales';
        }

        function detectUserLocation() {
            if (!navigator.geolocation) {
                showCustomMessage('Tu navegador no soporta geolocalización.');
                return;
            }
            const btn = document.querySelector('button[onclick="detectUserLocation()"]');
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin text-sm"></i>';

            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=14`);
                    const data = await response.json();
                    const address = data.address;
                    const neighborhood = address.neighbourhood || address.suburb || address.city_district || address.city || 'Mi ubicación';
                    document.getElementById('locationInput').value = neighborhood;
                    btn.innerHTML = '<i class="fa-solid fa-location-crosshairs text-sm text-orange-500"></i>';
                    showCustomMessage(`Ubicación detectada: ${neighborhood}`);
                } catch (e) {
                    document.getElementById('locationInput').value = `${lat.toFixed(3)}, ${lon.toFixed(3)}`;
                    btn.innerHTML = '<i class="fa-solid fa-location-crosshairs text-sm text-orange-500"></i>';
                }
            }, () => {
                showCustomMessage('No se pudo obtener tu ubicación por GPS.');
                btn.innerHTML = '<i class="fa-solid fa-location-crosshairs text-sm text-orange-500"></i>';
            });
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value.trim() || 'Menú del día';
            const location = document.getElementById('locationInput').value.trim() || 'Barcelona Centro';

            const container = document.getElementById('resultsContainer');
            document.getElementById('resultsTitle').innerText = `Resultados para "${query}" en ${location}`;
            
            container.innerHTML = `
                <div class="col-span-full py-16 text-center bg-white rounded-2xl border border-slate-200 shadow-xs">
                    <div class="w-12 h-12 bg-orange-100 text-orange-500 rounded-xl flex items-center justify-center mx-auto mb-4 animate-spin text-xl">
                        <i class="fa-solid fa-utensils"></i>
                    </div>
                    <p class="font-bold text-slate-800 text-sm">Buscando locales especializados en ${query}...</p>
                    <p class="text-xs text-slate-400 mt-1">Explorando zona ${location}</p>
                </div>
            `;

            setTimeout(() => {
                currentResults = generateSmartResults(query, location);
                sortResults();
            }, 400);
        }

        // MOTOR INTELIGENTE DE GENERACIÓN SEGÚN CATEGORÍA (Ramen, Pizza, Hamburguesas, Menú, Callos...)
        function generateSmartResults(query, location) {
            const q = query.toLowerCase();
            let category = 'traditional';
            
            if (q.includes('ramen') || q.includes('noodle') || q.includes('sushi') || q.includes('asiat') || q.includes('japon')) {
                category = 'asian';
            } else if (q.includes('pizza') || q.includes('pasta') || q.includes('italian')) {
                category = 'italian';
            } else if (q.includes('burger') || q.includes('hamburguesa')) {
                category = 'burger';
            } else if (q.includes('bravas') || q.includes('tapas') || q.includes('callos') || q.includes('cap i pota')) {
                category = 'tapas';
            }

            const resultsByCat = {
                asian: [
                    { name: "Kitsune Ramen Bar", type: "Ramen-ya Auténtico", dish: `Especialidad: Tonkotsu Ramen tradicional con caldo 12h y chashu`, price: "12.50€", rating: "4.8", reviewsCount: 420, distanceMeters: 140, distanceText: "140m", address: "Carrer de Girona, 42" },
                    { name: "Yatai Izakaya", type: "Tasca Japonesa / Noodlería", dish: `Plato estrella: Shoyu Ramen y gyozas caseras de cerdo ibérico`, price: "13.00€", rating: "4.7", reviewsCount: 630, distanceMeters: 290, distanceText: "290m", address: "Carrer del Comte Borrell, 115" },
                    { name: "Ramen House Lab", type: "Restaurante Asiático", dish: `Menú Ramen con entrante de edamame y postre mochi`, price: "14.50€", rating: "4.6", reviewsCount: 310, distanceMeters: 410, distanceText: "410m", address: "Passeig de Sant Joan, 22" },
                    { name: "Udon & Broth", type: "Bar de Noodles", dish: `Especialidad: Miso Ramen picante con huevo marinado ajitama`, price: "11.90€", rating: "4.5", reviewsCount: 180, distanceMeters: 550, distanceText: "550m", address: "Carrer de Casp, 65" },
                    { name: "Osaka Street Noodle", type: "Cocina Japonesa Callejera", dish: `Ramen vegano de setas shiitake y caldo de sésamo negro`, price: "13.50€", rating: "4.7", reviewsCount: 245, distanceMeters: 620, distanceText: "620m", address: "Carrer de Bailèn, 88" },
                    { name: "Tokyo Noodle Bar", type: "Restaurante de Ramen", dish: `Tantanmen Ramen con carne picada especiada y ajonjolí`, price: "14.00€", rating: "4.4", reviewsCount: 190, distanceMeters: 750, distanceText: "750m", address: "Carrer de Trafalgar, 14" }
                ],
                italian: [
                    { name: "Spacca Napoli Pizzeria", type: "Pizzería Napolitana Auténtica", dish: `Pizza de masa madre fermentada 48h con mozzarella di bufala`, price: "13.50€", rating: "4.8", reviewsCount: 1250, distanceMeters: 180, distanceText: "180m", address: "Carrer de Carders, 31" },
                    { name: "Il Passatore", type: "Restaurante Italiano / Casero", dish: `Pasta fresca artesanal con ragú boloñesa tradicional`, price: "14.50€", rating: "4.6", reviewsCount: 420, distanceMeters: 120, distanceText: "120m", address: "Plaça del Palau, Ciutat Vella" },
                    { name: "Trattoria Da Marco", type: "Trattoria Italiana", dish: `Menú de mediodía con lasaña casera y focaccia al romero`, price: "12.90€", rating: "4.7", reviewsCount: 510, distanceMeters: 330, distanceText: "330m", address: "Carrer de Diputació, 240" },
                    { name: "Pizzeria Al Taglio Roma", type: "Pizzería al corte y plato", dish: `Porciones de pizza crujiente y tiramisú casero de la Nonna`, price: "9.50€", rating: "4.5", reviewsCount: 340, distanceMeters: 450, distanceText: "450m", address: "Carrer de Balmes, 52" },
                    { name: "Osteria del Vino", type: "Osteria y Bar de Vinos", dish: `Tagliolini al tartufo y copa de vino italiano incluida`, price: "16.00€", rating: "4.9", reviewsCount: 210, distanceMeters: 590, distanceText: "590m", address: "Carrer de Còrsega, 210" }
                ],
                burger: [
                    { name: "Timesburg Eixample", type: "Hamburguesería Artesanal", dish: `Hamburguesa de vaca vieja con cheddar madurado y bacon crujiente`, price: "12.90€", rating: "4.7", reviewsCount: 1820, distanceMeters: 210, distanceText: "210m", address: "Carrer de París, 195" },
                    { name: "Bacoa Burger", type: "Burguer Gourmet", dish: `La Catalana Burger con payoyo, cebolla caramelizada y patatas rústicas`, price: "13.50€", rating: "4.6", reviewsCount: 2300, distanceMeters: 310, distanceText: "310m", address: "Carrer del Ronda Universitat, 31" },
                    { name: "La Burguesería de Barrio", type: "Hamburguesería de Autor", dish: `Smash burger doble con salsa secreta y patatas fritas caseras`, price: "11.50€", rating: "4.5", reviewsCount: 420, distanceMeters: 420, distanceText: "420m", address: "Carrer de Mallorca, 275" },
                    { name: "Secret Burger Lab", type: "Burger & Craft Beer", dish: `Burger trufada con champiñones portobello y provolone fundido`, price: "14.20€", rating: "4.8", reviewsCount: 630, distanceMeters: 580, distanceText: "580m", address: "Carrer de Valencia, 340" }
                ],
                tapas: [
                    { name: "La Catalana", type: "Bodega de barrio / Tasca", dish: `Plato estrella: Tapas caseras y ${query} con producto del mercado`, price: "12.00€", rating: "4.7", reviewsCount: 310, distanceMeters: 180, distanceText: "180m", address: "Carrer de Mar, Born" },
                    { name: "Bodega Biarritz 1881", type: "Tasca tradicional", dish: `Surtido de tapas artesanas y guisados de la abuela`, price: "15.00€", rating: "4.8", reviewsCount: 2230, distanceMeters: 300, distanceText: "300m", address: "Carrer del Vidre, 8" },
                    { name: "Bar Gelida", type: "Bodega clásica de barrio", dish: `Bravas crujientes y cazuelita tradicional con vino de la casa`, price: "11.50€", rating: "4.5", reviewsCount: 2850, distanceMeters: 400, distanceText: "400m", address: "C/ del Urgell, 102" },
                    { name: "El Tomás de Sarrià Style", type: "Bar de Tapas", dish: `Las patatas bravas más famosas de la zona con salsa brava especial`, price: "8.50€", rating: "4.9", reviewsCount: 3400, distanceMeters: 520, distanceText: "520m", address: "Carrer Major de Sarrià, 49" }
                ],
                traditional: [
                    { name: "Bodega Biarritz 1881", type: "Tasca tradicional", dish: `Menú de tapas y guisados del día con ${query}`, price: "16.00€", rating: "4.8", reviewsCount: 2230, distanceMeters: 300, distanceText: "300m", address: "Carrer del Vidre, 8", menuIncluded: true },
                    { name: "Restaurante L'Olivera", type: "Cocina de mercado mediterránea", dish: `Menú ejecutivo de mediodía (${query}) con bebida y postre casero`, price: "14.50€", rating: "4.6", reviewsCount: 980, distanceMeters: 500, distanceText: "500m", address: "Carrer de Balmes, 137", menuIncluded: true },
                    { name: "Bar Gelida", type: "Bodega clásica", dish: `Menú casero tradicional con ${query} y vino de la casa con gaseosa`, price: "13.50€", rating: "4.5", reviewsCount: 2850, distanceMeters: 400, distanceText: "400m", address: "C/ del Urgell, 102", menuIncluded: true },
                    { name: "Bodega Sepúlveda", type: "Bodega / Tasca de mercado", dish: `Menú mediodía castellano-catalán (${query}) con producto fresco`, price: "15.50€", rating: "4.5", reviewsCount: 1240, distanceMeters: 550, distanceText: "550m", address: "Carrer de Sepúlveda, 173", menuIncluded: true },
                    { name: "Can Culleretes", type: "Restaurante histórico catalán", dish: `Menú del día tradicional de fonda (${query}) con postre artesano`, price: "18.00€", rating: "4.4", reviewsCount: 4520, distanceMeters: 200, distanceText: "200m", address: "Carrer d'en Quintana, 5", menuIncluded: true },
                    { name: "Bodega Joan", type: "Bodega / Brasería catalana", dish: `Menú del día completo (${query} de primero y brasa de segundo)`, price: "16.50€", rating: "4.4", reviewsCount: 3100, distanceMeters: 600, distanceText: "600m", address: "Carrer de Rosselló, 164", menuIncluded: true }
                ]
            };

            return resultsByCat[category] || resultsByCat.traditional;
        }

        function sortResults() {
            const sortBy = document.getElementById('sortSelect').value;
            if (!currentResults || currentResults.length === 0) return;

            if (sortBy === 'rating') {
                currentResults.sort((a, b) => parseFloat(b.rating) - parseFloat(a.rating));
            } else if (sortBy === 'distance') {
                currentResults.sort((a, b) => (a.distanceMeters || 0) - (b.distanceMeters || 0));
            }

            renderResults();
        }

        function renderResults() {
            const container = document.getElementById('resultsContainer');
            const location = document.getElementById('locationInput').value.trim() || 'Barcelona';
            
            if (!currentResults.length) {
                container.innerHTML = `<div class="col-span-full py-12 text-center text-slate-500 text-sm bg-white rounded-2xl border border-slate-200">No se encontraron resultados en esta zona.</div>`;
                return;
            }

            container.innerHTML = currentResults.map(item => {
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + item.address + ' ' + location)}`;
                
                let menuBadge = '';
                if (item.menuIncluded || item.price.includes('€')) {
                    menuBadge = `<div class="mt-2 text-xs font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-lg flex items-center justify-between">
                        <span><i class="fa-solid fa-check-circle mr-1.5 text-emerald-600"></i> Bebida incluida / Precio cerrado</span>
                    </div>`;
                }

                return `
                    <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs hover:shadow-md transition flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start gap-2 mb-2">
                                <div>
                                    <span class="text-[11px] font-bold text-orange-600 bg-orange-50 px-2 py-0.5 rounded-md uppercase tracking-wider">${item.type}</span>
                                    <h3 class="font-bold text-slate-900 text-base mt-1 leading-snug">${item.name}</h3>
                                </div>
                                <div class="flex items-center gap-1.5 shrink-0">
                                    <span class="text-xs font-extrabold text-orange-700 bg-orange-50 border border-orange-200 px-2.5 py-1 rounded-lg">🏷️ ${item.price}</span>
                                    <div class="flex items-center gap-1 bg-amber-50 border border-amber-200/60 px-2 py-1 rounded-lg text-xs font-bold text-amber-800">
                                        <i class="fa-solid fa-star text-amber-500 text-[10px]"></i>
                                        <span>${item.rating}</span>
                                        <span class="text-amber-600/70 font-normal text-[10px]">(${item.reviewsCount})</span>
                                    </div>
                                </div>
                            </div>

                            <p class="text-xs font-medium text-slate-700 bg-slate-50 p-2.5 rounded-xl border border-slate-100 mb-3">
                                <i class="fa-solid fa-plate-wheat text-orange-500 mr-1.5"></i> ${item.dish}
                            </p>

                            <div class="flex items-center justify-between text-xs text-slate-500 mb-3 px-0.5">
                                <span class="truncate max-w-[220px]"><i class="fa-solid fa-location-dot mr-1 text-slate-400"></i> ${item.address}</span>
                                <span class="font-semibold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded">Abierto ahora</span>
                            </div>

                            ${menuBadge}
                        </div>

                        <div class="pt-4 mt-4 border-t border-slate-100 flex items-center justify-between">
                            <div class="text-xs font-bold text-slate-700">
                                <i class="fa-solid fa-person-walking text-orange-500 mr-1"></i> A ${item.distanceText}
                            </div>
                            <button onclick="forceOpenMaps('${mapsUrl}')" class="bg-blue-50 hover:bg-blue-100 text-blue-600 font-bold px-4 py-2 rounded-xl text-xs transition flex items-center gap-1.5 cursor-pointer">
                                <i class="fa-solid fa-diamond-turn-right"></i>
                                <span>Ir (Google Maps)</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function forceOpenMaps(url) {
            const newWindow = window.open(url, '_blank');
            if (!newWindow || newWindow.closed || typeof newWindow.closed == 'undefined') {
                window.location.href = url;
            }
        }

        function toggleVoiceSearch() {
            if (!recognition) {
                showCustomMessage('El reconocimiento de voz no está soportado en este navegador.');
                return;
            }
            if (isListening) {
                recognition.stop();
                stopVoiceIndicator();
            } else {
                recognition.start();
                startVoiceIndicator();
            }
        }

        function startVoiceIndicator() {
            isListening = true;
            const micBtn = document.getElementById('micBtn');
            micBtn.classList.add('text-orange-500', 'bg-orange-100', 'pulse-ring');
            document.getElementById('searchInput').placeholder = 'Escuchando lo que te apetece...';
        }

        function stopVoiceIndicator() {
            isListening = false;
            const micBtn = document.getElementById('micBtn');
            micBtn.classList.remove('text-orange-500', 'bg-orange-100', 'pulse-ring');
            document.getElementById('searchInput').placeholder = '¿Qué os apetece hoy? (ej. Ramen, Pizza, Menú...)';
        }

        function toggleLiveAssistant() {
            const speechText = "¡Hola! Soy tu asistente Platàs. Escribe el plato que os apetezca y buscaré los mejores especialistas al instante.";
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(speechText);
                utterance.lang = 'es-ES';
                window.speechSynthesis.speak(utterance);
            }
            toggleVoiceSearch();
        }
    </script>
</body>
</html>
